<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Residuos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-wrapper">
    <div class="card">

        <div class="header">
            <div class="header-icon">♻️</div>
            <h1>Clasificador de Residuos</h1>
            <p>Sube una imagen y descubre cómo reciclarla correctamente</p>
        </div>

        <div id="dropZone" class="drop-zone">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <div class="drop-inner">
                <div class="drop-icon">📷</div>
                <div class="drop-text">
                    <strong>Arrastra una imagen aquí</strong><br>o haz clic para seleccionar
                </div>
                <div class="drop-formats">JPG, PNG, WEBP • Máx. 10 MB</div>
            </div>
        </div>

        <div class="preview-wrapper" id="previewWrapper">
            <img id="preview" class="preview-img" alt="Vista previa">
            <div class="preview-badge" id="previewBadge">imagen cargada</div>
        </div>

        <button class="btn-classify" id="btnClasificar">
            <span class="btn-inner">
                <div class="spinner" id="spinner"></div>
                <span id="btnText">Clasificar residuo</span>
            </span>
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <div class="result-box" id="resultado">
            <div class="result-header">
                <div class="result-icon-wrap" id="resultIcon"></div>
                <div class="result-label" id="resultLabel"></div>
            </div>
            <div class="result-body">
                <div class="confidence-row">
                    <span class="confidence-label">Nivel de confianza</span>
                    <span class="confidence-pct" id="resultPct"></span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="tip-box" id="tipBox"></div>
            </div>
        </div>

        <div class="footer-note">Powered by Joshua Galva · Clasificación automática de residuos</div>

    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
